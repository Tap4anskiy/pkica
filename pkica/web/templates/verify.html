{% extends "base.html" %}
{% block content %}
<h1>Проверка сертификата</h1>
<form method="post" action="/verify" class="stack">
  <label>Сертификат из списка
    <select name="serial">
      <option value="">Не выбран</option>
      {% for cert in certificates %}
      <option value="{{ cert.serial_number }}" {% if selected_serial == cert.serial_number %}selected{% endif %}>
        {{ cert.label }} / {{ cert.profile }} / {{ cert.display_status }} / {{ cert.serial_number }}
      </option>
      {% endfor %}
    </select>
  </label>
  <label>PEM<textarea name="pem" rows="12">{{ pem or "" }}</textarea></label>
  <label>или путь внутри стенда<input name="path" value="{{ path or "" }}"></label>
  <button>Проверить</button>
</form>
{% if result %}<h2>Результат</h2><pre>{{ result }}</pre>{% endif %}
{% endblock %}
