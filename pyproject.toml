[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkica"
version = "0.1.0"
description = "Educational Python-based Certificate Authority"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0"
]

[project.scripts]
pkica = "pkica.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pkica*"]