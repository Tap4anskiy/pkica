[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkica"
version = "0.1.0"
description = "Educational Python-based Certificate Authority"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "jinja2>=3.1.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0"
]

[project.scripts]
pkica = "pkica.cli:main"
pkica-web = "pkica.web.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pkica*"]

[tool.setuptools.package-data]
"pkica.web" = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
norecursedirs = ["data", "build", "dist", ".venv"]
